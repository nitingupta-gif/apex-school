<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Admin Login | Apex Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --royal-blue: #0a1128; --gold: #c5a059; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background: var(--royal-blue); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--white); width: 100%; max-width: 420px; padding: 50px 40px; box-shadow: 0 25px 50px rgba(0,0,0,0.3); border-top: 4px solid var(--gold); }
        h2 { font-family: 'Playfair Display', serif; color: var(--royal-blue); font-size: 2rem; margin-bottom: 10px; text-align: center; }
        p.subtitle { text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 30px; letter-spacing: 1px; text-transform: uppercase; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--royal-blue); margin-bottom: 8px; font-weight: 600; }
        input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; font-size: 0.95rem; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--gold); }
        .btn-submit { width: 100%; background: var(--royal-blue); color: var(--gold); border: 1px solid var(--gold); padding: 14px; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background: var(--gold); color: var(--royal-blue); }
        .error-msg { background: #ffebee; color: #c62828; padding: 10px; font-size: 0.85rem; text-align: center; margin-bottom: 20px; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; font-size: 0.8rem; }
        .back-link:hover { color: var(--gold); }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>System Admin</h2>
        <p class="subtitle">Restricted Access</p>
        {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
        <form action="/admin-login" method="POST">
            <div class="form-group">
                <label>Admin Username</label>
                <input type="text" name="username" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Authenticate</button>
        </form>
        <a href="/" class="back-link">&larr; Back to Home</a>
    </div>
</body>
</html>
